{{ define "main" }}
<section class="services page-top" id="services">
  <p class="section-tag">What we do</p>
  <h2 class="section-title">Strategic advisory for a <em>complex world</em></h2>
  <div class="divider"></div>
  <p class="services-intro">{{ .Params.intro }}</p>
  <div class="services-grid">
    {{ range .Params.services }}
    <div class="service-item">
      <div class="service-title">{{ .title }}</div>
      {{ range .paragraphs }}<p class="service-text">{{ . }}</p>{{ end }}
      {{ range .subtitles }}
      <div class="service-subtitle">{{ .label }}</div>
      <ul class="service-bullets">
        {{ range .bullets }}<li>{{ . }}</li>{{ end }}
      </ul>
      {{ end }}
    </div>
    {{ end }}
  </div>
</section>
{{ end }}
